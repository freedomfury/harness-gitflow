        in: query
        description: Tells whether the Entity is to be saved on Git or not
        schema:
          type: string
          enum:
          - INLINE
          - REMOTE
          - INLINE_HC
      - name: repoName
        in: query
        description: Name of the repository.
        schema:
          type: string
      - name: isHarnessCodeRepo
        in: query
        description: Is Harness code repo enabled
        schema:
          type: boolean
      - name: InputSetVersion
        in: query
        description: "Input set yaml version, should be one of '0' or '1'"
        schema:
          type: string
          default: "0"
      requestBody:
        description: "Input set YAML to be created. The Account, Org, Project, and\
          \ Pipeline identifiers inside the YAML should match the query parameters."
        content:
          application/yaml:
            schema:
              type: string
            examples:
              Create:
                summary: Sample Input Set YAML
                description: Sample Input Set YAML
                value: |
                  inputSet:
                      name: Sample Input Set
                      tags: {}
                      identifier: Sample_Input_Set
                      orgIdentifier: default
                      projectIdentifier: MISC
                      pipeline:
                          identifier: Sample_Pipeline
                          stages:
                              - stage:
                                    identifier: Sample_Stage
                                    type: Approval
                                    spec:
                                        execution:
                                            steps:
                                                - step:
                                                      identifier: Approval_Step
                                                      type: HarnessApproval
                                                      spec:
                                                          approvers:
                                                              userGroups:
                                                                  - account.Admins
                                                - step:
                                                      identifier: Shellscript_Step
                                                      type: ShellScript
                                                      spec:
                                                          source:
                                                              type: Inline
                                                              spec:
                                                                  script: echo "ShellScript"
                              - stage:
                                    identifier: Sample_Deploy_Stage
                                    type: Deployment
                                    spec:
                                        serviceConfig:
                                            serviceRef: Service1
                                        infrastructure:
                                            environmentRef: Env1
                                            infrastructureDefinition:
                                                type: KubernetesDirect
                                                spec:
                                                    connectorRef: account.harnessciplatform
                                                    namespace: sample
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Failure"
            application/yaml:
              schema:
                $ref: "#/components/schemas/Failure"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: "If the YAML is valid, returns created Input Set. If not, it\
            \ sends what is wrong with the YAML"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseDTOInputSetResponse"
            application/yaml:
              schema:
                $ref: "#/components/schemas/ResponseDTOInputSetResponse"
