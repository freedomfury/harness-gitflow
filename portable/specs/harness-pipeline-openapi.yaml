        description: "Filter properties for listing pipeline executions. The `filterType`\
          \ field is required and must be set to `PipelineExecution`. The `branchName`\
          \ field in this body filters executions by the codebase/repository branch\
          \ used during execution. This is different from the `branch` query parameter\
          \ (from Git Experience) which filters by the Git branch where the pipeline\
          \ YAML definition is stored. If both are provided, they filter independently."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineExecutionFilterProperties"
            examples:
              List:
                summary: Sample List Pipeline Executions
                description: Sample List Pipeline Executions JSON Payload
                value:
                  filterType: PipelineExecution
                  pipelineTags:
                  - key: tag1
                    value: value1
                  - key: tag2
                    value: value2
                  status:
                  - Success
                  - Failed
                  - Running
                  pipelineName: My Pipeline
                  timeRange:
                    timeRangeFilterType: LAST_30_DAYS
                  moduleProperties:
                    cd:
                      serviceIdentifiers:
                      - service1
                      - service2
                      envIdentifiers:
                      - dev
                      - prod
                      artifactDisplayNames:
                      - library/nginx:stable
                      - stable
                      serviceDefinitionTypes:
                      - Kubernetes
                      - NativeHelm
                      helmChartVersions:
                      - chartV1
                      - chartV2
                      gitOpsAppIdentifiers:
                      - app1
                      - app2
                    ci:
                      ciExecutionInfoDTO:
                        event: pullRequest
                        pullRequest:
                          sourceBranch: source-branch
                          targetBranch: target-branch
                  triggerTypes:
                  - MANUAL
                  - WEBHOOK
                  triggerIdentifiers:
                  - trigger1
                  - trigger2
                  pipelineIdentifiers:
                  - pipeline1
                  - pipeline2
                  myDeployments: true
                  branchName: main
                  repo: my-repo
                  inputSetIdentifiers:
                  - inputSet1
                  - inputSet2
                  planExecutionIds:
                  - exec1
                  - exec2
      responses:
        "400":
          description: Bad Request
          content:
