        schema:
          type: boolean
          default: false
      - name: module
        in: query
        description: "Harness module which triggered the execution. Examples: CD,\
          \ CI, CE, etc."
        schema:
          type: string
      - name: status
        in: query
        description: "Filter by execution status. Accepts multiple values. Valid values:\
          \ Running, AsyncWaiting, TaskWaiting, TimedWaiting, Failed, Errored, IgnoreFailed,\
          \ NotStarted, Expired, Aborted, Discontinuing, Queued, Paused, ResourceWaiting,\
          \ InterventionWaiting, ApprovalWaiting, WaitStepRunning, QueuedLicenseLimitReached,\
          \ QueuedExecutionConcurrencyReached, Success, Suspended, Skipped, Pausing,\
          \ ApprovalRejected, InputWaiting, AbortedByFreeze, UploadWaiting, QueuedGlobalInfraCapacityReached,\
          \ QUEUED_PLAN_CREATION"
        schema:
          type: array
          items:
            type: string
            description: "Execution Status of the entity. Valid values (PascalCase):\
              \ Running, AsyncWaiting, TaskWaiting, TimedWaiting, Failed, Errored,\
              \ IgnoreFailed, NotStarted, Expired, Aborted, Discontinuing, Queued,\
              \ Paused, ResourceWaiting, InterventionWaiting, ApprovalWaiting, WaitStepRunning,\
              \ QueuedLicenseLimitReached, QueuedExecutionConcurrencyReached, Success,\
              \ Suspended, Skipped, Pausing, ApprovalRejected, InputWaiting, AbortedByFreeze,\
              \ UploadWaiting, QueuedGlobalInfraCapacityReached, QUEUED_PLAN_CREATION."
            enum:
            - Running
            - AsyncWaiting
            - TaskWaiting
            - TimedWaiting
            - Failed
            - Errored
            - IgnoreFailed
            - NotStarted
            - Expired
            - Aborted
            - Discontinuing
            - Queued
            - Paused
            - ResourceWaiting
            - InterventionWaiting
            - ApprovalWaiting
            - WaitStepRunning
            - QueuedLicenseLimitReached
            - QueuedExecutionConcurrencyReached
            - Success
            - Suspended
            - Skipped
            - Pausing
            - ApprovalRejected
            - InputWaiting
            - AbortedByFreeze
            - UploadWaiting
            - QueuedGlobalInfraCapacityReached
            - QUEUED_PLAN_CREATION
            - NOT_STARTED
            - INTERVENTION_WAITING
            - APPROVAL_WAITING
            - APPROVAL_REJECTED
            - Waiting
            - Queued
            - Queued
            - Queued
      - name: myDeployments
        in: query
        description: Whether to filter executions triggered by the current user only
        schema:
          type: boolean
      - name: branch
        in: query
        description: Name of the branch.
        schema:
          type: string
      - name: repoIdentifier
