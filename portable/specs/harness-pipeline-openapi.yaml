openapi: 3.0.1
info:
  title: Pipeline Service API Reference
  description: This is the Open Api Spec 3 for the Pipeline Service. This is under
    active development. Beware of the breaking change with respect to the generated
    code stub
  termsOfService: https://harness.io/terms-of-use/
  contact:
    email: contact@harness.io
  version: "3.0"
servers:
- url: https://pipeline-service-866fc6f8ff-k2n4g/gateway/pipeline/api
tags:
- name: Filter
  description: This contains APIs related to Filter as defined in Harness
- name: TriggersEvents
  description: This contains APIs related to Trigger Event History.
- name: Triggers
  description: This contains APIs related to Triggers.
- name: Webhook Triggers
  description: This contains APIs related to Webhook Triggers.
- name: Approvals
  description: This contains APIs related to Pipeline approvals
- name: Pipeline Dashboard
  description: This contains APIs related to Pipeline Dashboard
- name: Pipeline data retention
  description: This contains APIs related to retention of pipeline execution data
- name: Pipeline
  description: This contains pipeline APIs for files as provided as runtime input
    during pipeline execution
- name: Pipeline Input Set
  description: This contains APIs related to Input Sets
- name: Branch Sequences
  description: APIs for managing branch-scoped build sequence IDs
- name: Execution Input
  description: APIs for runtime execution input on pipeline steps and stages.
- name: Pipeline Execution Details
  description: This contains APIs for fetching Pipeline Execution Details
- name: Queued Pipeline Executions
  description: APIs for observing queued pipeline executions at account level
- name: Pipeline Execute
  description: This contains APIs for Executing a Pipeline
- name: Pipeline Refresh
  description: This contains APIs related to validation of templates in pipeline yaml
paths:
  /filters:
    get:
      tags:
      - Filter
      summary: List Filters
      description: Lists Filters for the given criteria.
      operationId: getFilterList
      parameters:
      - name: pageIndex
        in: query
        description: "Page number of navigation. If left empty, default value of 0\
          \ is assumed."
        schema:
          type: integer
          format: int32
          default: 0
      - name: pageSize
        in: query
        description: "Number of entries per page. If left empty, default value of\
          \ 100 is assumed"
        schema:
          type: integer
          format: int32
          default: 100
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        schema:
          type: string
      - name: type
        in: query
        description: Type of Filter
        required: true
        schema:
          type: string
          enum:
          - Connector
          - Secret
          - DelegateProfile
          - Delegate
          - PipelineSetup
          - PipelineExecution
          - Deployment
          - Audit
          - Template
          - Trigger
          - EnvironmentGroup
          - FileStore
          - CCMRecommendation
          - Anomaly
          - RIInventory
          - SPInventory
          - Autocud
          - CCMConnector
          - CCMK8sConnector
          - Environment
          - RuleExecution
          - Override
          - InputSet
          - Webhook
          - CCMBudget
          - Service
          - QueuedPipeline
      - name: searchTerm
        in: query
        description: Text to search/filter the Entity.
        schema:
          type: string
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Failure"
            application/yaml:
              schema:
                $ref: "#/components/schemas/Failure"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Returns the list of Filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseDTOPageResponseFilter"
            text/yaml:
              schema:
                $ref: "#/components/schemas/ResponseDTOPageResponseFilter"
            text/html:
              schema:
                $ref: "#/components/schemas/ResponseDTOPageResponseFilter"
    put:
      tags:
      - Filter
      summary: Update a Filter
      description: Updates the filter for the given ID.
      operationId: updateFilter
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: This is the updated Filter. This should have all the fields not
          just the updated ones
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Filter"
          text/yaml:
            schema:
              $ref: "#/components/schemas/Filter"
          text/html:
            schema:
              $ref: "#/components/schemas/Filter"
          text/plain:
            schema:
              $ref: "#/components/schemas/Filter"
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Failure"
            application/yaml:
              schema:
                $ref: "#/components/schemas/Failure"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Returns the updated Filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseDTOFilter"
            text/yaml:
              schema:
                $ref: "#/components/schemas/ResponseDTOFilter"
            text/html:
              schema:
                $ref: "#/components/schemas/ResponseDTOFilter"
    post:
      tags:
      - Filter
      summary: Create a Filter
      description: Creates a Filter.
      operationId: postFilter
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      requestBody:
        description: Details of the Connector to create
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Filter"
          text/yaml:
            schema:
              $ref: "#/components/schemas/Filter"
          text/html:
            schema:
              $ref: "#/components/schemas/Filter"
          text/plain:
            schema:
              $ref: "#/components/schemas/Filter"
        required: true
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Failure"
            application/yaml:
              schema:
                $ref: "#/components/schemas/Failure"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
            application/yaml:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Returns created Filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseDTOFilter"
            text/yaml:
              schema:
                $ref: "#/components/schemas/ResponseDTOFilter"
            text/html:
              schema:
                $ref: "#/components/schemas/ResponseDTOFilter"
