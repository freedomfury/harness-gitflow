                      serviceIdentifiers:
                      - service1
                      - service2
                      envIdentifiers:
                      - dev
                      - prod
                      artifactDisplayNames:
                      - library/nginx:stable
                      - stable
                      serviceDefinitionTypes:
                      - Kubernetes
                      - NativeHelm
                      helmChartVersions:
                      - chartV1
                      - chartV2
                      gitOpsAppIdentifiers:
                      - app1
                      - app2
                    ci:
                      ciExecutionInfoDTO:
                        event: pullRequest
                        pullRequest:
                          sourceBranch: source-branch
                          targetBranch: target-branch
                  triggerTypes:
                  - MANUAL
                  - WEBHOOK
                  triggerIdentifiers:
                  - trigger1
                  - trigger2
                  pipelineIdentifiers:
                  - pipeline1
                  - pipeline2
                  myDeployments: true
                  branchName: main
                  repo: my-repo
                  inputSetIdentifiers:
                  - inputSet1
                  - inputSet2
                  planExecutionIds:
