  /pipeline/execute/retry/{identifier}:
    post:
      tags:
      - Pipeline Execute
      summary: Retry a executed pipeline with inputSet pipeline yaml
      operationId: retryPipeline
      parameters:
      - name: accountIdentifier
        in: query
        description: Account Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: orgIdentifier
        in: query
        description: Organization Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: projectIdentifier
        in: query
        description: Project Identifier for the Entity.
        required: true
        schema:
          type: string
      - name: moduleType
        in: query
        description: "Module type for the entity. If its from deployments,type will\
          \ be CD , if its from build type will be CI"
        schema:
          type: string
      - name: planExecutionId
        in: query
        description: This param contains the previous execution execution id. This
          is basically when we are rerunning a Pipeline.
        required: true
        schema:
          type: string
      - name: retryStages
        in: query
        description: 'This param contains the identifier of stages from where to resume.
          It will be a list if we want to retry from parallel group '
        required: true
        schema:
          type: array
          items:
            type: string
      - name: runAllStages
        in: query
        description: "This param provides an option to run only the failed stages\
          \ when Pipeline fails at parallel group. By default, it will run all the\
          \ stages in the failed parallel group."
        schema:
          type: boolean
          default: true
      - name: identifier
        in: path
        description: Pipeline Identifier
        required: true
        schema:
          type: string
      - name: notesForPipelineExecution
        in: query
        description: Notes of a pipeline execution
        schema:
          type: string
          default: ""
      - name: asyncPlanCreation
        in: query
        schema:
          type: boolean
          default: false
      requestBody:
        description: Retry a executed pipeline with inputSet pipeline yaml
        content:
          application/yaml:
            schema:
              type: string
            examples:
              Retry a executed pipeline with Runtime Input YAML:
                summary: Retry a executed pipeline with Runtime Input YAML
                description: Retry a executed pipeline with Runtime Input YAML
                value: "pipeline:\n  identifier: \"Sample_Pipeline\"\n  stages:\n\
                  \      - stage:\n          identifier: \"Sample_Stage\"\n      \
                  \    type: \"Approval\"\n          spec:\n              execution:\n\
                  \                  steps:\n                      - step:\n     \
                  \                     identifier: \"Approval_Step\"\n          \
                  \                type: \"HarnessApproval\"\n                   \
                  \       spec:\n                            approvers:\n        \
                  \                      userGroups: \n                          \
                  \      - account._account_all_users:\n                      - step:\n\
                  \                          identifier: \"Shellscript_Step\"\n  \
                  \                        type: \"ShellScript\"\n               \
                  \           spec:\n                            source:\n       \
                  \                       type: \"Inline\"\n                     \
                  \         spec:\n                                script: \"exit\
                  \ 0\"\n      - stage:\n          identifier: \"Sample_Deploy_Stage\"\
                  \n          type: \"Deployment\"\n          spec:\n            serviceConfig:\n\
                  \              serviceRef: \"service1\"\n            infrastructure:\n\
                  \                environmentRef: \"env1\"\n                infrastructureDefinition:\n\
                  \                              type: \"KubernetesDirect\"\n    \
                  \                          spec:\n                             \
                  \   connectorRef: \"KubernetesConnector>\"\n                   \
                  \             namespace: \"default\"\n"
      responses:
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Failure"
            application/yaml:
              schema:
                $ref: "#/components/schemas/Failure"
        "500":
          description: Internal server error
