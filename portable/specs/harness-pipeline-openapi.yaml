        required: true
        schema:
          type: string
      - name: type
        in: query
        description: Type of Filter
        required: true
        schema:
          type: string
          enum:
          - Connector
          - Secret
          - DelegateProfile
          - Delegate
          - PipelineSetup
          - PipelineExecution
          - Deployment
          - Audit
          - Template
          - Trigger
          - EnvironmentGroup
          - FileStore
          - CCMRecommendation
          - Anomaly
          - RIInventory
          - SPInventory
          - Autocud
          - CCMConnector
          - CCMK8sConnector
          - Environment
          - RuleExecution
          - Override
          - InputSet
