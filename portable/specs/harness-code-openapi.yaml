  /principals:
    get:
      operationId: listPrincipals
      parameters:
      - description: Account Identifier for the Entity.
        in: query
        name: accountIdentifier
        required: true
        schema:
          type: string
      - description: Organization Identifier for the Entity.
        in: query
        name: orgIdentifier
        required: false
        schema:
          type: string
      - description: Project Identifier for the Entity.
        in: query
        name: projectIdentifier
        required: false
        schema:
          type: string
      - description: The substring by which the principals are filtered.
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: The page to return.
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - description: The maximum number of results to return.
        in: query
        name: limit
        required: false
        schema:
          default: 30
          maximum: 100
          minimum: 1
          type: integer
      - description: The types of principals to include.
        in: query
        name: type
        required: false
        schema:
          items:
            enum:
            - service
            - serviceaccount
            - user
            type: string
          type: array
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TypesPrincipalInfo'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsererrorError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsererrorError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsererrorError'
          description: Internal Server Error
      tags:
      - principals
  /pullreq:
    get:
      operationId: listPullReqSpace
      parameters:
      - description: Account Identifier for the Entity.
        in: query
        name: accountIdentifier
        required: true
        schema:
          type: string
      - description: Organization Identifier for the Entity.
        in: query
        name: orgIdentifier
        required: false
        schema:
          type: string
      - description: Project Identifier for the Entity.
        in: query
        name: projectIdentifier
        required: false
        schema:
          type: string
      - description: The state of the pull requests to include in the result.
        explode: true
        in: query
        name: state
        required: false
        schema:
          items:
            default: open
            enum:
            - closed
            - merged
            - open
            type: string
          type: array
        style: form
      - description: Source repository ref of the pull requests.
        in: query
        name: source_repo_ref
        required: false
        schema:
          type: string
      - description: Source branch of the pull requests.
        in: query
        name: source_branch
        required: false
        schema:
          type: string
      - description: Target branch of the pull requests.
        in: query
        name: target_branch
        required: false
        schema:
          type: string
      - description: The substring by which the pull requests are filtered.
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: List of principal IDs who created pull requests.
        explode: true
        in: query
        name: created_by
        required: false
        schema:
          items:
            type: integer
          type: array
        style: form
      - description: The result should contain only entries created before this timestamp
          (unix millis).
        in: query
        name: created_lt
        required: false
        schema:
          minimum: 0
          type: integer
      - description: The result should contain only entries created after this timestamp
          (unix millis).
        in: query
        name: created_gt
        required: false
        schema:
          minimum: 0
          type: integer
      - description: The result should contain only entries updated before this timestamp
          (unix millis).
        in: query
        name: updated_lt
        required: false
        schema:
          minimum: 0
          type: integer
      - description: By providing this parameter the description would be excluded
          from the response.
        in: query
        name: exclude_description
        required: false
        schema:
          default: false
          type: boolean
      - description: The result should contain entries from the desired space and
          of its subspaces.
        in: query
        name: include_subspaces
        required: false
        schema:
          default: false
          type: boolean
      - description: The maximum number of results to return.
        in: query
        name: limit
        required: false
        schema:
          default: 30
          maximum: 100
          minimum: 1
          type: integer
      - description: List of label ids used to filter pull requests.
        explode: true
        in: query
        name: label_id
        required: false
        schema:
          items:
            type: integer
          type: array
        style: form
      - description: List of label value ids used to filter pull requests.
        explode: true
        in: query
        name: value_id
        required: false
        schema:
          items:
            type: integer
          type: array
        style: form
      - description: Return only pull requests where this user is the author.
        in: query
        name: author_id
        required: false
        schema:
          type: integer
      - description: Return only pull requests where this user has created at least
          one comment.
        in: query
        name: commenter_id
        required: false
        schema:
          type: integer
      - description: Return only pull requests where this user has been mentioned.
        in: query
        name: mentioned_id
        required: false
        schema:
          type: integer
      - description: Return only pull requests where this user has been added as a
          reviewer.
        in: query
        name: reviewer_id
        required: false
        schema:
          type: integer
      - description: Require only this review decision of the reviewer. Requires reviewer_id
          parameter.
        explode: true
        in: query
        name: review_decision
        required: false
        schema:
          items:
            enum:
            - approved
            - changereq
            - pending
            - reviewed
            type: string
          type: array
        style: form
      - description: If true, the git diff stats would be included in the response.
        in: query
        name: include_git_stats
        required: false
        schema:
          default: false
          type: boolean
      - description: If true, the summary of check for the branch commit SHA would
          be included in the response.
        in: query
        name: include_checks
        required: false
        schema:
          default: false
          type: boolean
      - description: If true, a list of rules that apply to this branch would be included
          in the response.
        in: query
        name: include_rules
        required: false
        schema:
          default: false
          type: boolean
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TypesPullReqRepo'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsererrorError'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsererrorError'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsererrorError'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsererrorError'
          description: Internal Server Error
      summary: List pull requests in account/org/project
      tags:
      - pullreq
  /pullreq/count:
    get:
      operationId: countPullReqSpace
      parameters:
      - description: Account Identifier for the Entity.
        in: query
        name: accountIdentifier
        required: true
        schema:
          type: string
      - description: Organization Identifier for the Entity.
        in: query
        name: orgIdentifier
        required: false
        schema:
          type: string
